<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrix Ai — Digital solution agency</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Font Awesome (cdnjs CDN) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --accent-cyan: #06b6d4;
      --accent-indigo: #4f46e5;
      --primary-soft: rgba(6, 182, 212, 0.14);
      --primary-border: rgba(2, 132, 199, 0.28);
      --bg-frost: #eef6fc;
      --bg-sidebar: #e3f0fa;
      --surface: #ffffff;
      --surface-muted: #e6f2fb;
      --code-bg: #070d1f;
      --code-header: #101b38;
      --code-text: #e0f2fe;
      --text-main: #081226;
      --text-secondary: #334b6e;
      --text-muted: #5b7396;
      --border-color: #cde0f2;
      --danger: #dc2626;
      --success: #0ea5e9;
      --sidebar-width: 272px;
      --topbar-height: 64px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(8, 18, 38, 0.06);
      --shadow-md: 0 8px 24px rgba(2, 132, 199, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-frost);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      background: linear-gradient(180deg, #f2f9ff 0%, var(--bg-frost) 100%);
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: sticky;
      top: 0;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .new-chat-btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: linear-gradient(135deg, var(--accent-cyan), var(--primary), var(--accent-indigo));
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.18s ease, transform 0.1s ease;
      box-shadow: var(--shadow-sm);
    }

    .new-chat-btn:hover {
      filter: brightness(1.06);
    }

    .new-chat-btn:active {
      transform: scale(0.99);
    }

    .sidebar-close-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--surface);
      color: var(--text-secondary);
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .sidebar-section-title {
      padding: 14px 16px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-history-empty {
      padding: 20px 12px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .chat-history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.88rem;
      font-weight: 500;
      transition: background-color 0.15s ease, color 0.15s ease;
      border: 1px solid transparent;
    }

    .chat-history-item:hover {
      background: rgba(255, 255, 255, 0.78);
      color: var(--text-main);
    }

    .chat-history-item.active {
      background: var(--surface);
      color: var(--primary);
      border-color: var(--primary-border);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .chat-history-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.8rem;
      opacity: 0.75;
      transition: opacity 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .chat-history-item:hover .delete-chat-btn,
    .chat-history-item.active .delete-chat-btn {
      opacity: 1;
    }

    .delete-chat-btn:hover {
      color: var(--danger);
      background: rgba(220, 38, 38, 0.08);
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 38, 0.45);
      z-index: 35;
    }

    .sidebar-backdrop.open {
      display: block;
    }

    /* Main Column */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Fixed Top Bar */
    .top-bar {
      position: fixed;
      top: 0;
      left: var(--sidebar-width);
      right: 0;
      height: var(--topbar-height);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 30;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .menu-toggle-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: var(--surface);
      color: var(--text-main);
      font-size: 1rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .menu-toggle-btn:hover {
      background: var(--surface-muted);
    }

    .avatar-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-cyan);
      background: var(--primary);
    }

    .avatar-fallback {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #ffffff;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--accent-cyan);
      user-select: none;
    }

    .brand-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ai-name-heading {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--primary);
      background: rgba(6, 182, 212, 0.14);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 9px;
      border-radius: 999px;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
    }

    .brand-credit {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Chat Scroll Container */
    .chat-container {
      flex: 1;
      padding-top: calc(var(--topbar-height) + 20px);
      padding-bottom: 150px;
      padding-left: 20px;
      padding-right: 20px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Welcome Screen */
    .welcome-screen {
      margin: auto 0;
      padding: 24px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .welcome-avatar-img {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-cyan);
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
      background: var(--primary);
    }

    .welcome-avatar-fallback {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--accent-cyan);
      box-shadow: var(--shadow-md);
      margin-bottom: 16px;
      user-select: none;
    }

    .welcome-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
      margin-bottom: 8px;
    }

    .welcome-subtitle {
      font-size: 0.98rem;
      color: var(--text-secondary);
      max-width: 560px;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      max-width: 680px;
      text-align: left;
    }

    .suggestion-card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 15px 16px;
      cursor: pointer;
      transition: border-color 0.18s ease, transform 0.15s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .suggestion-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--primary);
    }

    .suggestion-card-desc {
      font-size: 0.84rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Messages List */
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .message-row.user {
      align-items: flex-end;
    }

    .message-row.assistant {
      align-items: flex-start;
    }

    .user-bubble {
      max-width: min(82%, 620px);
      background: var(--primary-soft);
      border: 1px solid var(--primary-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }

    .assistant-message-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 100%;
      width: 100%;
    }

    .msg-avatar-img {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1.5px solid var(--accent-cyan);
      background: var(--primary);
    }

    .msg-avatar-fallback {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
      user-select: none;
    }

    .assistant-body-col {
      flex: 1;
      min-width: 0;
      max-width: calc(100% - 46px);
    }

    .assistant-card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border-color);
      border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
      padding: 14px 18px;
      font-size: 0.95rem;
      line-height: 1.65;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
      overflow-wrap: break-word;
    }

    .assistant-card.error-card {
      border-color: rgba(220, 38, 38, 0.35);
      background: #fef2f2;
      color: #991b1b;
    }

    /* Formatted Content Styles */
    .formatted-content p {
      margin-bottom: 10px;
    }

    .formatted-content p:last-child {
      margin-bottom: 0;
    }

    .formatted-content h1,
    .formatted-content h2,
    .formatted-content h3,
    .formatted-content h4 {
      margin: 14px 0 8px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-main);
    }

    .formatted-content h1:first-child,
    .formatted-content h2:first-child,
    .formatted-content h3:first-child {
      margin-top: 0;
    }

    .formatted-content h1 {
      font-size: 1.3rem;
    }
    .formatted-content h2 {
      font-size: 1.15rem;
    }
    .formatted-content h3 {
      font-size: 1.03rem;
    }

    .formatted-content ul,
    .formatted-content ol {
      margin: 8px 0 12px 22px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .formatted-content li {
      line-height: 1.55;
    }

    .formatted-content code.inline-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86em;
      background: var(--surface-muted);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    /* Code Block */
    .code-block {
      margin: 12px 0;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid #1e293b;
      background: var(--code-bg);
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--code-header);
      color: #bae6fd;
      font-size: 0.78rem;
      font-weight: 600;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .copy-code-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .copy-code-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .code-block pre {
      margin: 0;
      padding: 14px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--code-text);
    }

    /* Action Bar under AI Reply */
    .message-action-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding-left: 4px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .action-icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .action-icon-btn:hover {
      background: var(--surface);
      color: var(--text-main);
      border-color: var(--border-color);
    }

    .action-icon-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
      border-color: var(--primary-border);
      font-weight: 600;
    }

    .reply-timestamp {
      margin-left: 2px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Typing Indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-cyan);
      opacity: 0.35;
      animation: typingPulse 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingPulse {
      0%, 80%, 100% {
        transform: scale(0.85);
        opacity: 0.35;
      }
      40% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* Bottom Composer */
    .composer-dock {
      position: fixed;
      bottom: 0;
      left: var(--sidebar-width);
      right: 0;
      background: linear-gradient(
        to top,
        var(--bg-frost) 75%,
        rgba(238, 246, 252, 0) 100%
      );
      padding: 16px 20px 14px;
      z-index: 25;
    }

    .composer-inner {
      max-width: 860px;
      margin: 0 auto;
    }

    .composer-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1.5px solid var(--border-color);
      border-radius: 22px;
      padding: 8px 10px 8px 16px;
      box-shadow: var(--shadow-md);
      transition: border-color 0.18s ease;
    }

    .composer-box:focus-within {
      border-color: var(--accent-cyan);
    }

    .message-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-main);
      resize: none;
      max-height: 180px;
      min-height: 24px;
      padding: 4px 0;
    }

    .message-input::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-cyan), var(--primary), var(--accent-indigo));
      color: #ffffff;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: filter 0.18s ease, opacity 0.18s ease, transform 0.1s ease;
    }

    .send-btn:hover:not(:disabled) {
      filter: brightness(1.06);
      transform: scale(1.03);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background: var(--text-muted);
    }

    .disclaimer-note {
      margin-top: 8px;
      text-align: center;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    /* Responsive Mobile Styles */
    @media (max-width: 820px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-close-btn {
        display: inline-flex;
      }

      .menu-toggle-btn {
        display: inline-flex;
      }

      .top-bar {
        left: 0;
        padding: 0 14px;
      }

      .composer-dock {
        left: 0;
        padding: 12px 14px 12px;
      }

      .ai-name-heading {
        font-size: 1.1rem;
      }

      .brand-credit {
        display: none;
      }

      .suggestions-grid {
        grid-template-columns: 1fr;
      }

      .user-bubble {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Chat history sidebar">
      <div class="sidebar-header">
        <button id="newChatBtn" class="new-chat-btn" type="button">
          <i class="fa-solid fa-plus"></i>
          <span>New chat</span>
        </button>
        <button
          id="closeSidebarBtn"
          class="sidebar-close-btn"
          type="button"
          aria-label="Close sidebar"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="sidebar-section-title">Recent Chats</div>
      <div id="chatHistoryList" class="chat-history-list"></div>

      <div class="sidebar-footer">
        <span>Digital solution agency</span>
        <span>v1.0</span>
      </div>
    </aside>

    <!-- Main Column -->
    <div class="main-area">
      <!-- Fixed Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button
            id="openSidebarBtn"
            class="menu-toggle-btn"
            type="button"
            aria-label="Open chat history"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <div id="topBarAvatarContainer" class="avatar-wrap"></div>

          <div class="brand-title-group">
            <h1 id="topBarName" class="ai-name-heading">Metrix Ai</h1>
            <span class="online-badge">
              <span class="online-dot"></span>
              Online
            </span>
          </div>
        </div>

        <span class="brand-credit">Patrick Njoroge • Digital solution agency</span>
      </header>

      <!-- Chat Area -->
      <main id="chatContainer" class="chat-container">
        <section id="welcomeScreen" class="welcome-screen">
          <div id="welcomeAvatarContainer"></div>
          <h2 id="welcomeTitle" class="welcome-title">Hi, I'm Metrix Ai</h2>
          <p id="welcomeSubtitle" class="welcome-subtitle">
            I help students with coding and debugging—breaking down concepts, fixing bugs, and building clean solutions step by step.
          </p>
          <div id="suggestionsGrid" class="suggestions-grid"></div>
        </section>

        <div id="messagesList" class="messages-list"></div>
      </main>

      <!-- Input Dock -->
      <footer class="composer-dock">
        <div class="composer-inner">
          <div class="composer-box">
            <textarea
              id="messageInput"
              class="message-input"
              rows="1"
              placeholder="Ask Metrix Ai for coding or debugging help..."
              aria-label="Message input"
            ></textarea>
            <button
              id="sendBtn"
              class="send-btn"
              type="button"
              disabled
              aria-label="Send message"
            >
              <i class="fa-solid fa-paper-plane"></i>
            </button>
          </div>
          <p id="disclaimerNote" class="disclaimer-note">
            Metrix Ai can make mistakes.
          </p>
        </div>
      </footer>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
