<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06b6d4">
<title>Metrix Ai | Coding & Debugging Assistant</title>
<meta name="description" content="Metrix Ai helps students with coding and debugging. Created by Patrick Njoroge, Digital solution agency.">
<link rel="icon" href="avatar.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  /* Change these three to re-theme the whole app */
  --accent:#06b6d4;      /* electric cyan */
  --accent-2:#3b82f6;    /* neon blue */
  --accent-3:#6366f1;    /* sleek indigo */
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 55%,var(--accent-3) 100%);

  --bg:#eef6ff;
  --surface:rgba(255,255,255,.78);
  --surface-solid:#ffffff;
  --border:rgba(99,140,200,.25);
  --text:#0f1b33;
  --muted:#5f7090;
  --user-bubble:#dcefff;
  --code-bg:#0b1226;
  --code-head:#131d3b;
  --code-text:#d9e4ff;
  --ok:#22c55e;
  --danger:#e11d48;

  --topbar-h:64px;
  --sidebar-w:288px;
  --shadow:0 8px 30px rgba(59,130,246,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(6,182,212,.18),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(99,102,241,.16),transparent 60%),
    linear-gradient(180deg,#f3f9ff,#e9f1ff);
  background-attachment:fixed;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- avatar (image + letter fallback) ---------- */
.avatar-img,.avatar-fallback{border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.avatar-fallback{display:inline-flex;align-items:center;justify-content:center;background:var(--grad);color:#fff;font-weight:800}
.av-top{width:42px;height:42px;font-size:1.15rem;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(6,182,212,.45)}
.av-sm{width:36px;height:36px;font-size:1rem;margin-top:2px;box-shadow:0 0 0 2px #fff,0 2px 10px rgba(59,130,246,.25)}
.av-xl{width:96px;height:96px;font-size:2.6rem;box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(6,182,212,.35),0 12px 36px rgba(59,130,246,.3)}

/* ---------- fixed top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:50;
  display:flex;align-items:center;gap:12px;padding:0 16px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.menu-btn{display:none;width:40px;height:40px;border-radius:12px;font-size:1.15rem;color:var(--accent-2)}
.menu-btn:hover{background:rgba(59,130,246,.1)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-name{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.status{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;color:var(--muted);margin-top:2px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ---------- sidebar ---------- */
.sidebar{
  position:fixed;top:var(--topbar-h);bottom:0;left:0;width:var(--sidebar-w);z-index:40;
  display:flex;flex-direction:column;padding:16px 12px 12px;
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  transition:transform .28s ease;
}
.new-chat{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 14px;border-radius:14px;
  background:var(--grad);color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(59,130,246,.3);transition:transform .15s,box-shadow .2s;
}
.new-chat:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(59,130,246,.38)}
.side-label{margin:20px 8px 8px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chat-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.chat-row{display:flex;align-items:center;border-radius:12px;transition:background .15s}
.chat-row:hover{background:rgba(59,130,246,.08)}
.chat-row.active{background:rgba(6,182,212,.14)}
.chat-item{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 10px;text-align:left;font-size:.9rem}
.chat-item i{color:var(--accent-2);font-size:.9rem}
.chat-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-del{width:34px;height:34px;margin-right:4px;border-radius:9px;color:var(--muted);opacity:0;transition:opacity .15s,color .15s}
.chat-row:hover .chat-del,.chat-row.active .chat-del{opacity:1}
.chat-del:hover{color:var(--danger);background:rgba(225,29,72,.08)}
.empty-list{padding:10px;font-size:.85rem;color:var(--muted)}
.side-foot{padding:12px 8px 4px;border-top:1px solid var(--border);font-size:.75rem;color:var(--muted);line-height:1.5}
.side-foot b{color:var(--text)}
.overlay{display:none;position:fixed;inset:0;z-index:35;background:rgba(10,20,50,.35);backdrop-filter:blur(2px)}

/* ---------- main ---------- */
.main{position:fixed;top:var(--topbar-h);bottom:0;left:var(--sidebar-w);right:0;display:flex;flex-direction:column}
.chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:780px;margin:0 auto;padding:24px 16px 12px;display:flex;flex-direction:column;gap:22px}

.welcome{display:flex;flex-direction:column;align-items:center;text-align:center;padding:5vh 0 0;animation:rise .5s ease both}
.welcome h1{margin:26px 0 10px;font-size:clamp(1.6rem,4.5vw,2.2rem);font-weight:800;letter-spacing:-.02em}
.welcome h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome p{max-width:520px;color:var(--muted);line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:32px;text-align:left}
.card{
  display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);transition:transform .18s,border-color .18s,box-shadow .18s;
}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 34px rgba(6,182,212,.22)}
.card i{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--grad);margin-bottom:4px}
.card b{font-size:.95rem}
.card small{color:var(--muted);font-size:.82rem;line-height:1.45}

/* ---------- messages ---------- */
.msg{display:flex;gap:12px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg.user{justify-content:flex-end}
.msg.user .bubble{
  max-width:85%;background:var(--user-bubble);border:1px solid rgba(59,130,246,.22);
  border-radius:20px 20px 6px 20px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;
}
.ai-body{flex:1;min-width:0}
.msg.ai .bubble{
  background:var(--surface-solid);border:1px solid var(--border);border-radius:6px 20px 20px 20px;
  padding:14px 18px;line-height:1.65;overflow-wrap:anywhere;box-shadow:0 4px 18px rgba(59,130,246,.07);
}
.msg.error .bubble{background:#fff1f4;border-color:rgba(225,29,72,.3);color:#9f1239}
.retry{margin-top:10px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;background:var(--grad);color:#fff;font-size:.85rem;font-weight:600}

.bubble p{margin:0 0 10px}
.bubble>*:last-child{margin-bottom:0}
.bubble h2,.bubble h3,.bubble h4,.bubble h5,.bubble h6{margin:16px 0 8px;line-height:1.3;letter-spacing:-.01em}
.bubble h2{font-size:1.25rem}.bubble h3{font-size:1.12rem}.bubble h4,.bubble h5,.bubble h6{font-size:1rem}
.bubble ul,.bubble ol{margin:0 0 10px 22px}
.bubble li{margin:4px 0}
.bubble li::marker{color:var(--accent)}
.bubble a{color:var(--accent-2);text-decoration:underline;text-underline-offset:2px}
.bubble hr{border:0;height:1px;background:var(--border);margin:14px 0}
.bubble blockquote{margin:8px 0 10px;padding:6px 14px;border-left:3px solid var(--accent);background:rgba(6,182,212,.07);border-radius:0 10px 10px 0;color:#31425f}
.bubble code{font-family:ui-monospace,'SF Mono','JetBrains Mono',Consolas,monospace;font-size:.88em;padding:2px 6px;border-radius:6px;background:rgba(6,182,212,.12);color:#0369a1}

.codeblock{margin:12px 0;border-radius:14px;overflow:hidden;background:var(--code-bg);border:1px solid #1d2a52}
.code-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 14px;background:var(--code-head);color:#9fb3e6;font-size:.78rem}
.code-head .lang{font-weight:600;letter-spacing:.04em;text-transform:lowercase}
.code-copy{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;color:#bcd0ff;font-size:.78rem;font-weight:500}
.code-copy:hover{background:rgba(99,140,255,.18);color:#fff}
.codeblock pre{padding:14px 16px;overflow-x:auto}
.codeblock pre code{display:block;padding:0;background:none;color:var(--code-text);font-size:.86rem;line-height:1.6;white-space:pre}

.actions{display:flex;align-items:center;gap:4px;margin:6px 0 0 6px;color:var(--muted);font-size:.78rem}
.act{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:9px;color:var(--muted);transition:background .15s,color .15s}
.act:hover{background:rgba(59,130,246,.1);color:var(--accent-2)}
.act.active{color:var(--accent-2);background:rgba(59,130,246,.14)}
.act.done{color:var(--ok)}
.time{padding:0 6px;font-variant-numeric:tabular-nums}

.dots{display:inline-flex;gap:5px;padding:6px 2px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--accent-2)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--accent-3)}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}

/* ---------- composer ---------- */
.composer{padding:8px 16px calc(12px + env(safe-area-inset-bottom))}
.composer-inner{max-width:780px;margin:0 auto}
.input-wrap{
  display:flex;align-items:flex-end;gap:10px;padding:8px 8px 8px 18px;border-radius:26px;
  background:var(--surface-solid);border:1px solid var(--border);box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(6,182,212,.15),var(--shadow)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.5;padding:8px 0;max-height:160px}
textarea::placeholder{color:#8a99b5}
.send{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--grad);color:#fff;transition:transform .15s,opacity .2s}
.send:disabled{opacity:.35;cursor:not-allowed}
.send:not(:disabled):hover{transform:translateY(-1px) scale(1.05)}
.note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:8px}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(59,130,246,.25);border-radius:8px}

/* ---------- mobile ---------- */
@media (max-width:900px){
  .menu-btn{display:grid;place-items:center}
  .sidebar{transform:translateX(-100%);box-shadow:none;background:rgba(255,255,255,.96)}
  body.sidebar-open .sidebar{transform:translateX(0);box-shadow:8px 0 40px rgba(15,27,51,.2)}
  body.sidebar-open .overlay{display:block}
  .main{left:0}
  .chat-del{opacity:1}
}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .brand-name{font-size:1.3rem}
  .msg.user .bubble{max-width:92%}
  .msg.ai{gap:8px}
  .av-sm{width:32px;height:32px}
  .msg.ai .bubble{padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
  <div class="brand">
    <img class="avatar-img av-top" src="avatar.png" alt="Metrix Ai">
    <div>
      <div class="brand-name">Metrix Ai</div>
      <div class="status"><i></i> Online</div>
    </div>
  </div>
</header>

<aside class="sidebar" id="sidebar">
  <button class="new-chat" id="newChat"><i class="fa-solid fa-plus"></i> New chat</button>
  <div class="side-label">Recent chats</div>
  <div class="chat-list" id="chatList"></div>
  <div class="side-foot">Built by <b>Patrick Njoroge</b><br>Digital solution agency</div>
</aside>
<div class="overlay" id="overlay"></div>

<main class="main">
  <div class="chat" id="chat"><div class="chat-inner" id="chatInner"></div></div>
  <div class="composer">
    <div class="composer-inner">
      <form class="input-wrap" id="form" autocomplete="off">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Ask Metrix Ai about your code..." aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled><i class="fa-solid fa-arrow-up"></i></button>
      </form>
      <div class="note">Metrix Ai can make mistakes.</div>
    </div>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
